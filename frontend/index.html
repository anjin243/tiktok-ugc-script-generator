<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok UGC 视频生成器</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Genie Powered Project" />
    <meta name="author" content="Genie" />
  </head>
  <body>
    <div id="root">
      <div id="startup-status" style="min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f5f7fa;font-family:system-ui,sans-serif">
        <div style="max-width:36rem;padding:2rem;text-align:center">
          <h1 style="font-size:1.5rem;margin:0 0 .75rem">正在打开真人AI视频页面…</h1>
          <p style="color:#aeb6c2;margin:0">首次加载编译文件可能需要几秒，请稍候。</p>
        </div>
      </div>
    </div>
    <script>
      const showStartupFailure = () => {
        const root = document.getElementById('root')
        if (!root) return
        if (!document.getElementById('startup-status')) {
          root.innerHTML = '<div id="startup-status" style="min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f5f7fa;font-family:system-ui,sans-serif"><div style="max-width:36rem;padding:2rem;text-align:center"><h1 style="font-size:1.5rem;margin:0 0 .75rem"></h1><p style="color:#aeb6c2;margin:0"></p></div></div>'
        }
        const status = document.getElementById('startup-status')
        status.querySelector('h1').textContent = '页面脚本加载失败'
        status.querySelector('p').textContent = '请按 Ctrl+Shift+R 强制刷新；如果仍失败，请把此画面截图发给 Codex。'
      }
      window.addEventListener('error', showStartupFailure)
      window.addEventListener('unhandledrejection', showStartupFailure)
      window.setTimeout(showStartupFailure, 15000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
